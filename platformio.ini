; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rear_node
src_dir = src
data_dir = src/main_node/data

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = lib
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

[env:main_node]
build_src_filter = +<main_node/*> -<rear_node/>
board_build.filesystem = littlefs
extra_scripts = pre:fix_mklittlefs.py
lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit NeoMatrix
    adafruit/Adafruit ADS1X15
    bblanchon/ArduinoJson @ ^7

[env:rear_node]
build_src_filter = +<rear_node/*> -<main_node/>
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel

; Sensor node — F103C8T6 (Blue Pill), see src/sensor_node_f103/CLAUDE.md.
; ST-Link upload only: bxCAN and USB share SRAM on the F103, so no DFU/CDC.
[env:sensor_node_f103]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_src_filter = +<sensor_node_f103/*> -<main_node/> -<rear_node/>
build_flags =
    -DHAL_CAN_MODULE_ENABLED
    ; no _printf_float here — the display renders ×10 fixed-point with integer snprintf
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; Sensor node — STM32H523CET6 (F103 replacement), see src/sensor_node_h523/CLAUDE.md.
; ST-Link upload only, same as the F103 build. FDCAN-only chip; no bxCAN.
[env:sensor_node_h523]
platform = ststm32
board = generic_h523cetx
framework = arduino
upload_protocol = stlink
build_src_filter = +<sensor_node_h523/*> -<main_node/> -<rear_node/> -<sensor_node_f103/>
; The H523CE variant Arduino_Core_STM32 ships has no ldscript.ld at all (an
; upstream packaging gap for this newly-added variant) — see
; src/sensor_node_h523/CLAUDE.md. Point at our own copy instead.
board_build.ldscript = ${PROJECT_DIR}/boards/h523cetx_ldscript.ld
build_flags =
    -DHAL_FDCAN_MODULE_ENABLED   ; not on by default for H5 either, same as the H723 board
    ; Works around an upstream framework bug: stm32h5xx_ll_dlyb.c's guard
    ; (HAL_SD_MODULE_ENABLED / HAL_OSPI_MODULE_ENABLED / HAL_XSPI_MODULE_
    ; ENABLED) is satisfied by default on this chip, but the LL_DLYB_CfgTypeDef
    ; it needs ends up unavailable where the .c file uses it, so the build
    ; fails. We use no SD card, external QSPI/OSPI, or XSPI flash anywhere in
    ; this design, so disabling all three avoids the broken code path entirely.
    -DHAL_SD_MODULE_DISABLED
    -DHAL_OSPI_MODULE_DISABLED
    -DHAL_XSPI_MODULE_DISABLED
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
    paulstoffregen/OneWire
    milesburton/DallasTemperature
